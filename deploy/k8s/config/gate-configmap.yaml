apiVersion: v1
kind: ConfigMap
metadata:
  name: gate-config
data:
  gate.toml: |
    [node]
        name = "gate"
        host = "0.0.0.0"
        apps = ["gate"]
    
    [port]
        actor = 19001

    [postgres]
        url = "postgresql://postgres:%40zyc0131@host.docker.internal:5432/postgres?sslmode=disable"

    [redis]
        addr = "host.docker.internal:6379"
        password = "@zyc0131"
        db = 0
        dial_timeout = "5s"

    [log]
        path = "/var/log/game"
        level = "all"
        file = "{Y-m-d}.log"
        stStatus = 0

    [registery]
        type = "consul"
    [registery.consul]
        address = "host.docker.internal:8500"
        ttl = "20s"
        refresh_ttl = "10s"

    [trace]
        endpoint = "host.docker.internal:4317"

    [gxynet]
        peer = "tcp_server"
    [peer.tcp_server]
        addr = ":10086"
    [processor]
        packet = "ltiv"
        codec = "protobuf"
    [packet.ltiv]
        size_length = 2
        type_length = 1
        id_length = 2
        byte_order = "little"
        # 必须 ≤ 长度字段上限(2^(8*size_length)-1 = 65535), 否则检查不可达且 Encode 静默截断
        max_size = 65535

    [token]
        algorithm = "hs256"
        issuer = "account-service"
        expire_seconds = 300
        env = "dev"
    [token.hs256]
        secret = "replace-me"

    [metrics]
        addr = ":9091"
