apiVersion: v1
kind: ConfigMap
metadata:
  name: account-config
data:
  account.toml: |
    [node]
        name = "account"
        host = "0.0.0.0"
        apps = ["account"]

    [port]
        actor = 25106
        account = 18080

    [postgres]
        url = "postgresql://postgres:%40zyc0131@host.docker.internal:5432/postgres?sslmode=disable"

    [redis]
        addr = "host.docker.internal:6379"
        password = "@zyc0131"
        db = 0
        dial_timeout = "5s"

    [log]
        path = "/var/log/game"
        level = "all"
        file = "{Y-m-d}.log"
        stStatus = 0

    [registery]
        type = "consul"
    [registery.consul]
        address = "host.docker.internal:8500"
        ttl = "20s"
        refresh_ttl = "10s"

    [trace]
        endpoint = "host.docker.internal:4317"

    [gate.public]
        host = "127.0.0.1"
        port = 10086

    [version]
        min = "1.0.0"
        latest = "1.0.0"

    [token]
        algorithm = "hs256"
        issuer = "account-service"
        expire_seconds = 300
        env = "dev"
    [token.hs256]
        secret = "replace-me"
    [token.ed25519]
        private_key = ""
        public_key = ""
