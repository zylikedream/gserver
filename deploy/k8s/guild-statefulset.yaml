apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: guild
  labels:
    app.kubernetes.io/part-of: gserver
spec:
  serviceName: guild-svc
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: guild
  template:
    metadata:
      labels:
        app: guild
        app.kubernetes.io/part-of: gserver
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      hostAliases:
        - ip: "172.18.0.1"
          hostnames:
            - "host.docker.internal"
      terminationGracePeriodSeconds: 30
      containers:
        - name: guild
          image: game-server:latest
          imagePullPolicy: IfNotPresent
          args: ["--config", "/config/guild.toml"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: actor
              containerPort: 19001
            - name: guild
              containerPort: 19002
            - name: metrics
              containerPort: 9091
          volumeMounts:
            - name: config
              mountPath: /config
            - name: log
              mountPath: /var/log/game
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9091
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: config
          configMap:
            name: guild-config
        - name: log
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: guild-svc
  labels:
    app: guild
spec:
  clusterIP: None
  selector:
    app: guild
  ports:
    - name: actor
      port: 19001
