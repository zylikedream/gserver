apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate
  labels:
    app.kubernetes.io/part-of: gserver
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gate
  template:
    metadata:
      labels:
        app: gate
        app.kubernetes.io/part-of: gserver
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      hostAliases:
        - ip: "172.18.0.1"
          hostnames:
            - "host.docker.internal"
      terminationGracePeriodSeconds: 30
      containers:
        - name: gate
          image: gserver:latest
          imagePullPolicy: IfNotPresent
          args: ["--config", "/config/gate.toml"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: grpc
              containerPort: 19001
            - name: tcp
              containerPort: 10086
          volumeMounts:
            - name: config
              mountPath: /config
            - name: log
              mountPath: /var/log/game
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9091
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
      volumes:
        - name: config
          configMap:
            name: gate-config
        - name: log
          emptyDir: {}
