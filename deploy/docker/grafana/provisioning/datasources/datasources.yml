apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Prometheus-K8s
    type: prometheus
    access: proxy
    url: http://host.docker.internal:30999

  # Loki 放在 Tempo 之前: Tempo 的 tracesToLogs 引用 loki 数据源,
  # Grafana 13 在 provisioning 阶段按顺序解析引用, 反向引用会报 data source not found。
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"([0-9a-f]+)"'
          datasourceUid: tempo
          url: '$${__value.raw}'

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogs:
        datasourceUid: loki
        tags: ['job']
        filterByTraceID: true
