[gxynet]
	peer = "tcp_server" # 网络节点名字

[peer.tcp_server]
	addr = ":10086"

[message]
	codec = "json" # 消息类型

[processor]
	packet = "ltpv" # 解包的解码器

[packet.ltpv] # 解码配置
	size_length = 2 #包大小字段的长度
	type_length = 1 # 类型字段的长度
	path_length = 2 # 消息id长度
	byte_order = "little" # 字节序
	max_size = 3145728 # 3M
