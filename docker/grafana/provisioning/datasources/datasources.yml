apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Prometheus-K8s
    type: prometheus
    access: proxy
    url: http://host.docker.internal:9999

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
