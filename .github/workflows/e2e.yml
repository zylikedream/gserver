name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *" # nightly UTC 22:00

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_OUT_DIR: $RUNNER_TEMP/gserver-e2e
      PGPASSWORD: ci_password
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: |
            go.sum
            client/go.sum

      - name: Start postgres
        run: |
          docker run -d --name postgres -e POSTGRES_PASSWORD=ci_password -e POSTGRES_DB=gserver -p 5432:5432 postgres:16
          for i in $(seq 1 45); do
            docker exec postgres pg_isready -U postgres -d gserver && break
            sleep 1
          done
          docker exec postgres pg_isready -U postgres -d gserver

      - name: Start redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:7 redis-server --requirepass ci_password
          # runner 无 redis-cli,用容器内命令检查(docker exec)
          for i in $(seq 1 45); do
            docker exec redis redis-cli -a ci_password ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done
          docker exec redis redis-cli -a ci_password ping | grep -q PONG

      - name: Start consul
        run: |
          docker run -d --name consul -p 8500:8500 hashicorp/consul:1.18 agent -dev -client=0.0.0.0
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:8500/v1/status/leader >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8500/v1/status/leader >/dev/null

      # 生成 config/*.toml(CI 专用 dev_ci 环境,已跟踪;gen_config.py 需 toml 包)
      - name: Generate config
        run: |
          pip install --quiet toml
          bash build/script/svr_init.sh dev_ci

      - name: Run E2E
        run: make e2e

      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/gserver-e2e/**/*
          if-no-files-found: ignore
