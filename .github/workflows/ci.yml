name: CI

# 只有 PR 触发 CI;且 PR 必须包含代码相关路径变更才跑。
# 纯文档 PR(SKILL.md/docs/README)不触发;master push(PR 合并)不重复跑。
on:
  pull_request:
    paths:
      - 'core/**/*.go'
      - 'src/**/*.go'
      - 'node/**/*.go'
      - 'protocol/**/*.proto'
      - 'protocol/**/*.go'
      - 'client/**/*.go'
      - 'client/go.mod'
      - 'client/go.sum'
      - 'client/Makefile'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'Makefile'
      - 'hack/**'
      - 'build/**'
      - '.github/workflows/ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: |
            go.sum
            client/go.sum

      # 固定 protoc 3.19.3 + protoc-gen-go v1.36.11(校验 SHA256)
      - name: Tools
        run: make tools

      # 重新生成双端 PB,要求工作区无漂移(捕获协议源未同步生成代码)
      - name: PB drift check
        run: make pb-check

      # client 黑盒 seam:不得 require/import gserver 实现
      - name: Client boundary check
        run: make check-client-boundary

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          # 需 v2.x(go1.25 构建): v1.latest(1.64.8) 是 go1.24 构建, 不认识 go 1.25.1
          version: v2.12.2
          args: --timeout=5m
