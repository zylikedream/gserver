name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: make test

      - name: Lint
        run: |
          # 不用 golangci-lint-action(Node 20 运行时告警); 直接 go install 锁版本
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          $(go env GOPATH)/bin/golangci-lint run ./...
