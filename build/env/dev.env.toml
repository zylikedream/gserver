# ====================================
# 开发环境配置模板
# 使用方式: cp dev.env.toml dev_<name>.env.toml，然后修改你自己的配置
# ====================================

[env]
name = "dev"

[postgres]
host = "127.0.0.1"
port = 5432
user = "postgres"
password = ""
database = "gserver"
sslmode = "disable"

[redis]
host = "127.0.0.1"
port = 6379
password = ""
db = 0

[consul]
host = "127.0.0.1"
port = 8500

[trace]
host = "127.0.0.1"
port = 4317

[metrics]
port = 9091

[gate]
tcp_port = 11086
public_host = "127.0.0.1"

[account]
actor_port = 25106
http_port = 18080

[version]
min = "1.0.0"
latest = "1.0.0"

[token]
algorithm = "hs256"
issuer = "account-service"
expire_seconds = 300
env = "dev"

[token.hs256]
secret = "dev-secret"

[token.ed25519]
private_key = ""
public_key = ""

[log]
path = "./log"
level = "all"
stStatus = 0
