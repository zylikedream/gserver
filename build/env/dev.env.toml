# ====================================
# 开发环境配置模板
# 使用方式: cp dev.env.toml dev_<name>.env.toml，然后修改你自己的配置
# ====================================

[env]
name = "dev"

[postgres]
host = "127.0.0.1"
port = 5432
user = "postgres"
password = ""
database = "gserver"
sslmode = "disable"

[redis]
host = "127.0.0.1"
port = 6379
password = ""
db = 0

[consul]
host = "127.0.0.1"
port = 8500

[trace]
host = "127.0.0.1"
port = 4317

[metrics]
port = 9091

[gate]
tcp_port = 11086

[log]
path = "./log"
level = "all"
stStatus = 0
