# ====================================
# 开发环境配置模板
# 使用方式: cp dev.env.toml dev_<name>.env.toml，然后修改你自己的配置
# ====================================

[env]
name = "dev_ci"

[postgres]
host = "127.0.0.1"
port = 5432
user = "postgres"
password = "ci_password"
database = "gserver"
sslmode = "disable"

[redis]
host = "127.0.0.1"
port = 6379
password = "ci_password"
db = 0

[consul]
host = "127.0.0.1"
port = 8500

[trace]
host = "127.0.0.1"
port = 4317

[metrics]
port = 9091

# 多进程模式下各 app 独立的 metrics 端口
[metrics_gate]
port = 9090

[metrics_role]
port = 9091

[metrics_chat]
port = 9093

[metrics_friend]
port = 9094

[metrics_guild]
port = 9095

[gate]
tcp_port = 11086
public_host = "127.0.0.1"


[port]
# 各模块 Actor/业务端口，覆盖 template 中的默认值
# actor 会同时影响所有模块，如需精细控制请按需设置
# actor = 25001
# chat = 25042
# friend = 25022
# guild = 25032
# role = 25011
# account = 18080
http_port = 18080

[version]
min = "1.0.0"
latest = "1.0.0"

[token]
algorithm = "hs256"
issuer = "account-service"
expire_seconds = 300
env = "dev_ci"

[token.hs256]
secret = "dev-secret"

[token.ed25519]
private_key = ""
public_key = ""

[log]
path = "./log"
level = "all"
stStatus = 0
[role_limit.default]
rate = 10.0
burst = 20
disabled = false

[login_limit]
enabled = true
rate = 200.0
burst = 400
max_inflight = 100
queue_size = 500
wait_timeout = "3s"
