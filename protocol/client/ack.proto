// ID: 01001~01099
syntax = "proto3";
option go_package="./pb;pb";
package galaxy.protocol;

import "msg_options.proto";

// 每个协议都会回一个ack表示确认
enum AckCode {
    ACK_CODE_OK = 0;
    ACK_CODE_ERROR = 1;
    ACK_CODE_RATE_LIMITED = 2;
    ACK_CODE_MODULE_DISABLED = 3;
}

message Ack {
    option (msg_id) = 01001;
    AckCode code = 1;
    string id = 2; // 协议id
    string reason = 3;
}