syntax = "proto3";
option go_package="./pb;pb";
package galaxy.protocol;
import "google/protobuf/any.proto";

message ActorTimerMsg {
    string name = 1;     
    int64 time = 3;
}

message ActorError {
    string reason = 1;
}

message ClientMsg {
    google.protobuf.Any msg = 1;
}

message ServerMsg {
    google.protobuf.Any msg = 1;
}