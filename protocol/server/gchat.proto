// === 频道 Actor 内部消息（服务器内部使用，无 msg_id） ===
syntax = "proto3";
option go_package="./pb;pb";
package galaxy.protocol;

import "gactor.proto";

message ChannelRegisterMsg {
    int64 role_id = 1;
    ActorPid pid = 2;
    int32 channel_type = 3;
    int64 channel_id = 4;
}

message ChannelUnregisterMsg {
    int64 role_id = 1;
    int32 channel_type = 2;
    int64 channel_id = 3;
}

// 发送频道消息（Actor 内部请求）
message ReqChannelSend {
    int32 channel_type = 1;
    int64 channel_id = 2;
    int64 sender_id = 3;
    string content = 4;
}