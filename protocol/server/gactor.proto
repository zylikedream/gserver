syntax = "proto3";
option go_package="./pb;pb";
package galaxy.protocol;
import "google/protobuf/any.proto";


message ActorTimerMsg {
    string name = 1;     
    int64 time = 3;
}

message ActorError {
    string reason = 1;
}

message ClientMsg {
    string id = 1;
    google.protobuf.Any msg = 2;
}

message ServerMsg {
    google.protobuf.Any msg = 1;
}

message ActorActive {
    string kind = 1;
    string id = 2;
    bool allow_spawn = 3;
}

message ActorLocateRetry {
}

message ActorStop {
    string reason = 1;
}

// ActorPid 是可跨节点传递的 actor 引用。
// 运行时进程标识由"节点 + 序号 + 创建时刻"构成;创建时刻用于拒绝指向
// 已消失实例的陈旧引用,因此必须一并携带,否则跨节点投递会被运行时的
// 代际校验拒绝。
message ActorPid {
    string address = 1;  // 节点名
    string name = 2;     // 注册名(可寻址时),形如 <kind>/<id>
    uint64 pid = 3;      // 进程序号
    int64 creation = 4;  // 实例创建时刻
}

